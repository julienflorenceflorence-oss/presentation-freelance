<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Julien FLORENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="prestige.css?v=2.1">
    <style>
        /* --- Orientation Lock Overlay --- */
        #orientation-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #orientation-overlay svg {
            width: 80px; height: 80px;
            fill: var(--primary-gold);
            margin-bottom: 20px;
            animation: rotateDevice 2s infinite;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        @media screen and (max-width: 1365px) and (orientation: landscape) and (hover: none) and (pointer: coarse) {
            #orientation-overlay { display: flex; }
            body { overflow: hidden !important; }
        }

        body { overflow-x: hidden; overflow-y: auto; min-height: 100vh; margin: 0; background: #0F1115; }

        .app-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: radial-gradient(circle at center, #1a1e26 0%, #0F1115 100%);
        }

        .services-header {
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        .section-title { font-family: 'Cinzel', serif; color: var(--primary-gold); font-size: 2.5rem; margin-bottom: 10px; }

        /* --- THE TACTICAL STAGE (Desktop) --- */
        .tactical-stage {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 60vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            perspective: 1000px;
        }

        .field-team {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .player-trigger {
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-trigger img {
            width: 140px;
            filter: grayscale(1) brightness(0.5) contrast(1.2);
            transition: all 0.4s;
            border-bottom: 2px solid transparent;
        }

        .player-trigger .num {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            opacity: 0.2;
            transition: 0.4s;
        }

        .player-trigger:hover img, .player-trigger.active img {
            filter: brightness(1) contrast(1.1) drop-shadow(0 0 20px var(--gold-glow));
            transform: scale(1.1);
            border-bottom-color: var(--primary-gold);
        }

        .player-trigger:hover .num, .player-trigger.active .num { opacity: 1; transform: scale(1.2); }

        .coach-vision {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateY(-10deg);
        }

        .coach-main {
            height: 55vh;
            filter: drop-shadow(0 0 30px rgba(0,0,0,1));
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .hq-tablet {
            position: absolute;
            top: 35%;
            left: 58%;
            width: 240px;
            height: 170px;
            background: #000;
            border: 4px solid #1a1a1a;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 15px var(--gold-glow);
            padding: 6px;
            z-index: 20;
            transform: rotate(-3deg);
        }

        .tablet-screen {
            width: 100%; height: 100%;
            background: #050505;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .mini-goal { position: absolute; top: 8px; right: 8px; width: 60px; opacity: 0.3; }
        .beacon { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; top: 28px; right: 35px; box-shadow: 0 0 15px #fff; animation: pulse 1s infinite alternate; }

        .node {
            position: absolute;
            width: 22px; height: 22px;
            border: 1.5px solid var(--primary-gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-size: 0.6rem;
            color: var(--primary-gold);
            transition: 0.4s;
            cursor: pointer;
        }

        .node.highlight { background: var(--primary-gold); color: #000; box-shadow: 0 0 15px var(--primary-gold); transform: scale(1.3); }

        .intel-panel {
            position: fixed;
            right: 40px;
            bottom: 60px;
            width: 340px;
            background: rgba(22, 26, 35, 0.98);
            border-left: 4px solid var(--primary-gold);
            padding: 25px;
            backdrop-filter: blur(30px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 1000;
        }

        .intel-panel.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .intel-title { font-family: 'Cinzel', serif; color: var(--primary-gold); font-size: 1.2rem; margin-bottom: 15px; }
        .intel-body { color: var(--text-dim); font-size: 0.9rem; line-height: 1.8; }

        @keyframes pulse { from { opacity: 0.5; transform: scale(1); } to { opacity: 1; transform: scale(1.3); } }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 1024px) {
            html, body { overflow-x: hidden !important; width: 100% !important; height: auto !important; }
            .app-container { height: auto !important; min-height: 100vh; padding: 80px 20px 40px; display: block; width: 100%; box-sizing: border-box; }
            .services-header { margin-bottom: 30px; }
            .section-title { font-size: 1.8rem; }

            .tactical-stage { flex-direction: column; height: auto; perspective: none; align-items: center; display: flex; width: 100%; gap: 30px; }
            
            .field-team { width: 100%; gap: 15px; display: flex; flex-direction: column; }
            .player-trigger { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 12px; padding: 10px; width: 100%; box-sizing: border-box; }
            .player-trigger img { width: 80px; height: 80px; border-radius: 8px; filter: brightness(0.9); }
            .player-trigger .num { font-size: 1.8rem; opacity: 1; width: auto; }

            .coach-vision { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 20px; transform: none; }
            .coach-main { width: 100%; max-width: 300px; height: auto; opacity: 0.4; margin-bottom: -40px; }

            /* Fix Tablette Smartphone */
            .hq-tablet {
                position: relative !important;
                left: auto !important;
                top: auto !important;
                margin: 20px auto !important;
                transform: none !important;
                width: 280px !important;
                height: 200px !important;
                display: block;
            }

            .intel-panel { 
                position: relative; 
                width: 100%; 
                right: auto; bottom: auto;
                margin: 20px 0;
                max-height: 0;
                opacity: 0;
                overflow: hidden;
                display: block;
                transition: all 0.6s ease;
            }

            .intel-panel.show { max-height: 1000px; opacity: 1; padding: 25px; margin-bottom: 40px; }
        }

        @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="orientation-overlay">
        <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6M12,8A4,4 0 0,0 8,12A4,4 0 0,0 12,16A4,4 0 0,0 16,12A4,4 0 0,0 12,8Z"/></svg>
        <h2 style="color: var(--primary-gold); font-family: 'Cinzel', serif;">Orientation Portrait Requise</h2>
        <p style="color: var(--text-dim); margin-top: 10px;">Veuillez faire pivoter votre appareil.</p>
    </div>

    <header>
        <a href="index.html" class="logo">STRUC.IA</a>
        <div class="burger-menu" id="burger"><div></div><div></div><div></div></div>
        <nav class="nav-links" id="nav">
            <a href="index.html">Accueil</a>
            <a href="methode.html">Ma Méthode</a>
            <a href="services.html">Services</a>
            <a href="https://julienflorenceflorence-oss.github.io/cv-prestige/index.html" target="_blank" style="color: var(--primary-gold); font-weight: bold;">Mon CV</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="app-container">
        <div class="services-header">
            <h2 class="section-title">L'Ingénierie Tactique</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem; letter-spacing: 1px;">SÉLECTIONNEZ UN JOUEUR POUR ANALYSER LA STRATÉGIE</p>
        </div>

        <div class="tactical-stage">
            <div class="field-team">
                <div class="player-trigger" data-id="1">
                    <span class="num">01</span>
                    <img src="hand balleur.jpeg" alt="Joueur 1">
                </div>
                <div class="player-trigger" data-id="2">
                    <span class="num">02</span>
                    <img src="hand balleur.jpeg" alt="Joueur 2" style="margin-left: 20px;">
                </div>
                <div class="player-trigger" data-id="3">
                    <span class="num">03</span>
                    <img src="hand balleur.jpeg" alt="Joueur 3">
                </div>
            </div>

            <div class="coach-vision">
                <img src="coach handball.jpg" alt="Coach" class="coach-main">
                <div class="hq-tablet">
                    <div class="tablet-screen">
                        <svg width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none; opacity:0.4;">
                            <rect x="0" y="0" width="100%" height="100%" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="2"/>
                            <line x1="0" y1="100" x2="240" y2="100" stroke="rgba(212,175,55,0.2)" stroke-width="1"/>
                        </svg>
                        <img src="images.png" class="mini-goal" alt="But">
                        <div class="beacon"></div>
                        <div class="node" id="n1" style="bottom: 25px; left: 30px;">01</div>
                        <div class="node" id="n2" style="bottom: 75px; left: 105px;">02</div>
                        <div class="node" id="n3" style="bottom: 35px; right: 50px;">03</div>
                    </div>
                </div>

                <div class="intel-panel" id="intel-panel">
                    <h4 class="intel-title" id="intel-title">Tactique IA</h4>
                    <p class="intel-body" id="intel-body">En attente de sélection...</p>
                </div>
            </div>
        </div>

        <div style="margin-top: 50px; text-align:center;">
            <a href="contact.html" class="cta-button">Lancer le Match</a>
        </div>
    </div>

    <script>
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');
        burger.addEventListener('click', () => { nav.classList.toggle('active'); burger.classList.toggle('toggle'); });

        const serviceData = {
            1: { title: "Diagnostic Tactique", desc: "Audit chirurgical de vos flux. Nous identifions les pertes de balles technologiques pour tracer le chemin le plus court vers la performance." },
            2: { title: "Système Intelligent", desc: "Architecture IA & No-Code. Nous bâtissons un moteur robuste qui automatise vos succès et scale vos opérations sans friction." },
            3: { title: "Victoire Collective", desc: "Management Coach & Hand. L'outil n'est rien sans l'équipe. Nous alignons l'humain sur la techno pour une exécution foudroyante." }
        };

        const players = document.querySelectorAll('.player-trigger');
        const nodes = document.querySelectorAll('.node');
        const panel = document.getElementById('intel-panel');
        const title = document.getElementById('intel-title');
        const body = document.getElementById('intel-body');

        const showDetails = (id) => {
            players.forEach(p => p.classList.remove('active'));
            nodes.forEach(n => n.classList.remove('highlight'));
            const activePlayer = document.querySelector(`.player-trigger[data-id="${id}"]`);
            if (activePlayer) activePlayer.classList.add('active');
            const targetNode = document.getElementById(`n${id}`);
            if (targetNode) targetNode.classList.add('highlight');
            title.innerText = serviceData[id].title;
            body.innerText = serviceData[id].desc;
            panel.classList.add('show');
            if (window.innerWidth <= 1024) {
                setTimeout(() => { panel.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 150);
            }
        };

        const hideDetails = () => {
            if (window.innerWidth > 1024) {
                players.forEach(p => p.classList.remove('active'));
                nodes.forEach(n => n.classList.remove('highlight'));
                panel.classList.remove('show');
            }
        };

        players.forEach(player => {
            const id = player.getAttribute('data-id');
            player.addEventListener('mouseenter', () => showDetails(id));
            player.addEventListener('mouseleave', hideDetails);
            player.addEventListener('click', () => showDetails(id));
        });

        nodes.forEach(node => {
            const id = node.innerText.replace('0', '');
            node.addEventListener('mouseenter', () => showDetails(id));
            node.addEventListener('mouseleave', hideDetails);
            node.addEventListener('click', () => showDetails(id));
        });
    </script>
</body>
</html>
