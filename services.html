<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | Julien FLORENCE</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="prestige.css">
    <style>
        body { overflow: hidden; height: 100vh; } /* UX immersive : Pas de scroll body */

        .app-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: radial-gradient(circle at center, #1a1e26 0%, #0F1115 100%);
        }

        .services-header {
            text-align: center;
            margin-bottom: 40px;
            z-index: 10;
        }

        /* --- THE TACTICAL STAGE --- */
        .tactical-stage {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 60vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            perspective: 1000px;
        }

        /* L'Équipe sur le terrain (Gauche) */
        .field-team {
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .player-trigger {
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .player-trigger img {
            width: 140px;
            filter: grayscale(1) brightness(0.5) contrast(1.2);
            transition: all 0.4s;
            border-bottom: 2px solid transparent;
        }

        .player-trigger .num {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            color: var(--primary-gold);
            opacity: 0.2;
            transition: 0.4s;
        }

        .player-trigger:hover img, .player-trigger.active img {
            filter: brightness(1) contrast(1.1) drop-shadow(0 0 20px var(--gold-glow));
            transform: scale(1.1) translateX(10px);
            border-bottom-color: var(--primary-gold);
        }

        .player-trigger:hover .num, .player-trigger.active .num {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Le Coach et sa Technologie (Droite) */
        .hub-vision {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateY(-10deg);
        }

        .coach-main {
            height: 55vh;
            filter: drop-shadow(0 0 30px rgba(0,0,0,1));
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        /* Tablette HQ */
        .hq-tablet {
            position: absolute;
            top: 35%;
            left: 58%;
            width: 240px;
            height: 170px;
            background: #000;
            border: 4px solid #1a1a1a;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), 0 0 15px var(--gold-glow);
            padding: 6px;
            z-index: 20;
            transform: rotate(-3deg);
        }

        .tablet-screen {
            width: 100%; height: 100%;
            background: #050505;
            border: 1px solid rgba(212, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }

        .mini-goal { position: absolute; top: 8px; right: 8px; width: 60px; opacity: 0.3; filter: brightness(2) sepia(1); }
        .beacon { position: absolute; width: 8px; height: 8px; background: #fff; border-radius: 50%; top: 28px; right: 35px; box-shadow: 0 0 15px #fff; animation: pulse 1s infinite alternate; }

        .node {
            position: absolute;
            width: 22px; height: 22px;
            border: 1.5px solid var(--primary-gold);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Cinzel', serif; font-size: 0.6rem;
            color: var(--primary-gold);
            transition: 0.4s;
        }

        .node.highlight { background: var(--primary-gold); color: #000; box-shadow: 0 0 15px var(--primary-gold); transform: scale(1.3); }

        /* --- INTELLIGENCE PANEL (The AR Display) --- */
        .intel-panel {
            position: fixed;
            right: 40px;
            bottom: 60px; /* Aligné sur le niveau du bouton "Lancer le Match" */
            width: 340px;
            background: rgba(22, 26, 35, 0.98);
            border-left: 4px solid var(--primary-gold);
            padding: 25px;
            backdrop-filter: blur(30px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 1000;
            box-shadow: 0 10px 50px rgba(0,0,0,0.9);
        }

        .intel-panel.show { 
            opacity: 1; 
            visibility: visible;
            transform: translateY(0); 
        }

        .intel-title { font-family: 'Cinzel', serif; color: var(--primary-gold); font-size: 1.2rem; margin-bottom: 15px; letter-spacing: 2px; }
        .intel-body { color: var(--text-dim); font-size: 0.9rem; line-height: 1.8; }

        @keyframes pulse { from { opacity: 0.5; transform: scale(1); } to { opacity: 1; transform: scale(1.3); } }

        @media (max-width: 1024px) {
            body { overflow-y: auto; height: auto; }
            .app-container { height: auto; padding: 20px; }
            .tactical-stage { flex-direction: column; height: auto; }
            .field-team { flex-direction: row; margin-bottom: 50px; }
            .player-trigger img { width: 100px; }
            .intel-panel { position: relative; width: 100%; top: auto; transform: none; margin-top: 40px; border: 1px solid var(--primary-gold); }
            .intel-panel.show { transform: none; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">STRUC.IA</a>
        <div class="burger-menu" id="burger"><div></div><div></div><div></div></div>
        <nav class="nav-links" id="nav">
            <a href="index.html">Accueil</a>
            <a href="methode.html">Ma Méthode</a>
            <a href="services.html">Services</a>
            <a href="https://julienflorenceflorence-oss.github.io/cv-prestige/index.html" target="_blank" style="color: var(--primary-gold); font-weight: bold;">Mon CV</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="app-container">
        <div class="services-header">
            <h2 class="section-title">L'Ingénierie Tactique</h2>
            <p style="color: var(--text-dim); font-size: 0.9rem; letter-spacing: 1px;">SÉLECTIONNEZ UN JOUEUR POUR ANALYSER LA STRATÉGIE</p>
        </div>

        <div class="tactical-stage">
            <!-- Terrain à gauche -->
            <div class="field-team">
                <div class="player-trigger" data-id="1" data-title="Diagnostic Tactique" data-desc="Audit chirurgical de vos flux. Nous identifions les pertes de balles technologiques pour tracer le chemin le plus court vers la performance.">
                    <span class="num">01</span>
                    <img src="hand balleur.jpeg" alt="Joueur 1">
                </div>
                <div class="player-trigger" data-id="2" data-title="Système Intelligent" data-desc="Architecture IA & No-Code. Nous bâtissons un moteur robuste qui automatise vos succès et scale vos opérations sans friction.">
                    <span class="num">02</span>
                    <img src="hand balleur.jpeg" alt="Joueur 2" style="margin-left: 40px;">
                </div>
                <div class="player-trigger" data-id="3" data-title="Victoire Collective" data-desc="Management Coach & Hand. L'outil n'est rien sans l'équipe. Nous alignons l'humain sur la techno pour une exécution foudroyante.">
                    <span class="num">03</span>
                    <img src="hand balleur.jpeg" alt="Joueur 3">
                </div>
            </div>

            <!-- Vision Coach au centre/droite -->
            <div class="coach-vision">
                <img src="coach handball.jpg" alt="Coach" class="coach-main">
                
                <!-- Tablette Command -->
                <div class="hq-tablet">
                    <div class="tablet-screen">
                        <!-- Handball Court Markings -->
                        <svg width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none; opacity:0.4;">
                            <!-- Court Outline -->
                            <rect x="0" y="0" width="100%" height="100%" fill="none" stroke="rgba(212,175,55,0.2)" stroke-width="2"/>
                            <!-- Center Line -->
                            <line x1="0" y1="160" x2="240" y2="160" stroke="rgba(212,175,55,0.2)" stroke-width="1"/>
                            <!-- 6m Area (Solid) -->
                            <path d="M 40,0 Q 40,80 120,80 Q 200,80 200,0" fill="none" stroke="var(--primary-gold)" stroke-width="1.5" opacity="0.6"/>
                            <!-- 9m Line (Dashed) -->
                            <path d="M 20,0 Q 20,110 120,110 Q 220,110 220,0" fill="none" stroke="var(--primary-gold)" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
                        </svg>

                        <img src="images.png" class="mini-goal" alt="But">
                        <div class="beacon"></div>
                        <div class="node" id="n1" style="bottom: 25px; left: 30px;">01</div>
                        <div class="node" id="n2" style="bottom: 75px; left: 105px;">02</div>
                        <div class="node" id="n3" style="bottom: 35px; right: 50px;">03</div>
                        
                        <!-- Play Path -->
                        <svg width="100%" height="100%" style="position:absolute; top:0; left:0; pointer-events:none; opacity:0.5;">
                            <path d="M 40,130 Q 110,100 200,35" stroke="var(--primary-gold)" fill="none" stroke-dasharray="3"/>
                        </svg>
                    </div>
                </div>

                <!-- Panneau d'Intelligence (Overlay) -->
                <div class="intel-panel" id="intel-panel">
                    <h4 class="intel-title" id="intel-title">Coup d'envoi</h4>
                    <p class="intel-body" id="intel-body">En attente de sélection tactique...</p>
                </div>
            </div>
        </div>

        <div style="margin-top: 50px;">
            <a href="contact.html" class="cta-button">Lancer le Match</a>
        </div>
    </div>

    <script>
        const burger = document.getElementById('burger');
        const nav = document.getElementById('nav');
        burger.addEventListener('click', () => { nav.classList.toggle('active'); burger.classList.toggle('toggle'); });

        const players = document.querySelectorAll('.player-trigger');
        const panel = document.getElementById('intel-panel');
        const title = document.getElementById('intel-title');
        const body = document.getElementById('intel-body');

        players.forEach(player => {
            const showDetails = () => {
                const id = player.getAttribute('data-id');
                
                // Reset states
                players.forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.node').forEach(n => n.classList.remove('highlight'));

                // Set Active
                player.classList.add('active');
                const targetNode = document.getElementById(`n${id}`);
                if (targetNode) targetNode.classList.add('highlight');

                // Update Intel Panel
                title.innerText = player.getAttribute('data-title');
                body.innerText = player.getAttribute('data-desc');
                panel.classList.add('show');
            };

            const hideDetails = () => {
                player.classList.remove('active');
                const id = player.getAttribute('data-id');
                const targetNode = document.getElementById(`n${id}`);
                if (targetNode) targetNode.classList.remove('highlight');
                panel.classList.remove('show');
            };

            // Desktop Hover
            player.addEventListener('mouseenter', showDetails);
            player.addEventListener('mouseleave', hideDetails);

            // Mobile/Tablet Support (Click)
            player.addEventListener('click', (e) => {
                if (window.innerWidth <= 1024) {
                    showDetails();
                }
            });
        });
    </script>
</body>
</html>
